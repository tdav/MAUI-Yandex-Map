name: Publish NuGet

# Builds all three packages on macOS (the iOS binding needs Xcode) and pushes them to nuget.org.
# Requires the repository secret NUGET_API_KEY. Run manually or push a tag like v0.1.0-preview.2.
on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Prerelease suffix (empty for a stable release)'
        required: false
        default: 'preview.1'
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workloads
        run: dotnet workload install maui
      - name: Download Yandex MapKit iOS SDK
        run: tools/fetch-ios-sdk.sh
      - name: Verify binding selectors against SDK headers
        run: python3 tools/verify-ios-selectors.py
      - name: Pack
        env:
          EVENT: ${{ github.event_name }}
          SUFFIX_INPUT: ${{ inputs.version_suffix }}
        run: |
          # Manual run: suffix from the input (empty = stable). Tag v1.2.3-preview.2: suffix after the first '-'.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SUFFIX="$SUFFIX_INPUT"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            SUFFIX="${GITHUB_REF_NAME#*-}"
          else
            SUFFIX=""
          fi
          echo "Version suffix: '${SUFFIX}'"
          for p in src/Yandex.MapKit.Android.Binding src/Yandex.MapKit.iOS.Binding src/Yandex.MapKit.Maui; do
            dotnet pack "$p" -c Release -o artifacts -p:VersionSuffix="$SUFFIX"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "::error::Secret NUGET_API_KEY is not set"; exit 1; fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
