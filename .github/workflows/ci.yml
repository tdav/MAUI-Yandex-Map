name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        # net10.0 only: no mobile workloads needed.
        run: dotnet test tests/Yandex.MapKit.Maui.Tests -c Release -p:YandexCoreOnly=true

  android:
    name: Android (binding, library, sample APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workloads
        run: dotnet workload install maui-android
      - name: Install Android SDK platform
        run: >
          dotnet build samples/Yandex.MapKit.Sample -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true
      - name: Build Android binding
        run: dotnet build src/Yandex.MapKit.Android.Binding -c Release
      - name: Build sample
        run: dotnet build samples/Yandex.MapKit.Sample -f net10.0-android -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: sample-apk
          path: samples/Yandex.MapKit.Sample/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: warn

  apple:
    name: iOS (SDK check, binding, sample) + NuGet packages
    # The .NET 10 iOS workload tracks the newest Xcode; macos-15 images lag behind.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workloads
        run: dotnet workload install maui
      - name: Download Yandex MapKit iOS SDK
        run: tools/fetch-ios-sdk.sh
      - name: Verify binding selectors against SDK headers
        run: python3 tools/verify-ios-selectors.py
      - name: Build iOS binding
        run: dotnet build src/Yandex.MapKit.iOS.Binding -c Release
      - name: Build sample (simulator)
        run: dotnet build samples/Yandex.MapKit.Sample -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64
      - name: Pack
        run: |
          dotnet pack src/Yandex.MapKit.Android.Binding -c Release -o artifacts
          dotnet pack src/Yandex.MapKit.iOS.Binding -c Release -o artifacts
          dotnet pack src/Yandex.MapKit.Maui -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
